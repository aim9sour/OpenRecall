name: Windows smoke

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.17.0

jobs:
  windows-production-and-chrome:
    name: Windows production and stable Chrome
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository policy
        env:
          OPENRECALL_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-committed-whitespace.mjs
          node scripts/check-adapter-boundaries.mjs
          node scripts/check-lockfile-versions.mjs
          pnpm release:licenses
      - name: Type-check every workspace
        run: pnpm check
      - name: Test Windows package contracts
        run: pnpm test:package
      - name: Exercise Windows migrations, backup, and restore
        run: pnpm vitest run packages/database/src/migrations packages/database/src/backup-service.test.ts apps/server/src/durability/restore-service.test.ts apps/server/src/routes/restore.test.ts
      - name: Build production workspaces
        run: pnpm build
      - name: Smoke-test the Windows production server
        run: node scripts/smoke-production.mjs
      - name: Run accessibility suites in stable Chrome
        run: pnpm test:e2e
        env:
          OPENRECALL_BROWSER_CHANNEL: chrome
