name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.17.0

jobs:
  release-gates:
    name: Release gates (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check repository policy and formatting
        env:
          OPENRECALL_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/check-committed-whitespace.mjs
          node scripts/check-adapter-boundaries.mjs
          node scripts/check-lockfile-versions.mjs
          pnpm release:licenses
      - name: Type-check every workspace
        run: pnpm check
      - name: Exercise migrations, backup, and restore fixtures
        run: pnpm vitest run packages/database/src/migrations packages/database/src/backup-service.test.ts apps/server/src/durability/restore-service.test.ts apps/server/src/routes/restore.test.ts
      - name: Run unit, property, and integration tests
        run: pnpm test
      - name: Build production workspaces
        run: pnpm build
      - name: Smoke-test the production server
        run: node scripts/smoke-production.mjs

  browser-accessibility:
    name: Playwright and axe (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser and accessibility suites
        run: pnpm test:e2e

  node-26-compatibility:
    name: Informational compatibility (Node 26)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Install Node.js Current
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Check adapter boundaries
        run: node scripts/check-adapter-boundaries.mjs
      - name: Type-check every workspace
        run: pnpm check
