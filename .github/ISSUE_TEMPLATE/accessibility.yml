name: Accessibility report
description: Report a keyboard, reflow, contrast, focus, or screen-reader defect.
title: "[Accessibility]: "
labels:
  - accessibility
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thank you for making OpenRecall more accessible. Never attach a real SQLite database, backup, private card content, logs, traces, secrets, usernames, or absolute machine paths.
  - type: input
    id: version
    attributes:
      label: OpenRecall version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: 140.0.7339.81
    validations:
      required: true
  - type: input
    id: assistive-technology
    attributes:
      label: Keyboard and screen-reader combination
      placeholder: Keyboard only, or NVDA 2026.2 with Chrome
    validations:
      required: true
  - type: dropdown
    id: speech-mode
    attributes:
      label: NVDA speech mode
      options:
        - Talk
        - Beeps
        - Off
        - Not using NVDA
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Interface locale
      options:
        - Arabic (RTL)
        - English (LTR)
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme or contrast mode
      options:
        - System
        - Light
        - Dark
        - Windows forced colors
    validations:
      required: true
  - type: input
    id: focus-target
    attributes:
      label: Focus target
      description: Name the control or content that had keyboard focus.
      placeholder: Show answer button
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: List exact keystrokes and use invented card content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result or concise announcement
      description: Write only the speech or behavior that should occur.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result or announcement
      description: Quote only the short, relevant announcement.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I verified that this report contains no real SQLite database, backup, private study content, logs, traces, secrets, usernames, or absolute machine paths.
          required: true
