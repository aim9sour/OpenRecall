name: Feature request
description: Propose a focused improvement that preserves OpenRecall's local-first boundary.
title: "[Feature]: "
labels:
  - feature
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Explain the user outcome, not only an implementation. Never attach a real SQLite database, backup, private card content, logs, traces, secrets, usernames, or absolute machine paths.
  - type: input
    id: version
    attributes:
      label: OpenRecall version
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: 140.0.7339.81
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the current limitation with synthetic examples.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic current workflow
      description: Show how the task works today using invented card content only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
      description: Describe the observable result you want.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual outcome today
      description: Describe what prevents that outcome in the current release.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Privacy, accessibility, and compatibility constraints
      description: Explain effects on local-only use, SQLite durability, Arabic/English, keyboard, screen readers, and scheduler compatibility.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I verified that this request contains no real SQLite database, backup, private study content, logs, traces, secrets, usernames, or absolute machine paths.
          required: true
