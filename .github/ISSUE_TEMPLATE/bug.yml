name: Bug report
description: Report a reproducible OpenRecall defect using synthetic data.
title: "[Bug]: "
labels:
  - bug
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve OpenRecall. Never attach a real SQLite database, backup, private card content, logs, traces, secrets, usernames, or absolute machine paths.
  - type: input
    id: version
    attributes:
      label: OpenRecall version
      description: Use the release tag or commit SHA shown in the application.
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: chrome-version
    attributes:
      label: Chrome version
      placeholder: 140.0.7339.81
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: List the smallest steps and use invented card content only.
      placeholder: |
        1. Start OpenRecall.cmd.
        2. Create a section named Example.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I verified that this report contains no real SQLite database, backup, private study content, logs, traces, secrets, usernames, or absolute machine paths.
          required: true
